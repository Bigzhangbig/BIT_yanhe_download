<!DOCTYPE html>
<html lang="ch">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.5" />
  <link rel="stylesheet" href="styles.css" />
  <title>延河下载器</title>
</head>

<body>
  <div class="container">
    <button id="newTaskButton" class="btn blue">新建任务</button>
    <div id="taskList">

    </div>
  </div>

  <!-- Popup for creating a new task -->
  <div id="taskPopup" class="popup">
    <div class="popup-content">
      <span class="close">&times;</span>

      <!-- 课程搜索区域 -->
      <div class="form-group search-section">
        <div class="tab-bar">
          <button type="button" class="tab active" data-tab="search" onclick="switchTab('search')">搜索课程</button>
          <button type="button" class="tab" data-tab="my" onclick="switchTab('my')">我的课程</button>
        </div>

        <div id="searchPanel">
          <div class="search-bar">
            <input type="text" id="searchKeyword" class="input-field search-input" placeholder="输入课程名搜索..." />
            <select id="semesterFilter" class="input-field semester-select">
              <option value="">全部学期</option>
            </select>
            <button type="button" class="btn" onclick="doSearch()">搜索</button>
          </div>
        </div>

        <div id="myPanel" style="display:none;">
          <div class="search-bar">
            <button type="button" class="btn" onclick="loadMyCourses()">加载我的课程</button>
          </div>
        </div>

        <div id="searchResults" class="search-results">
          <p class="search-hint">搜索课程后点击选择</p>
        </div>
        <div id="pagination" class="pagination"></div>
      </div>

      <!-- 原有表单 -->
      <form id="taskForm">
        <div class="form-group">
          <label for="courseId">课程ID号:</label>
          <input type="text" id="courseId" name="courseId" class="input-field" />
          <label for="auth">身份认证码: </label>
          <p id="auth_prompt">{{ auth_prompt }}</p>
          <input type="text" id="auth" name="auth" class="input-field" placeholder="{{ auth }}" />
          <button type="button" class="btn" onclick="fetchCourseNumber()">
            获取课程信息
          </button>
          <button type="button" class="btn" onclick="ssoLogin()">
            SSO 登录
          </button>
        </div>
        <div class="form-group">
          <label for="downloadType">下载类型:</label>
          <select id="downloadType" name="downloadType" class="input-field">
            <option value="1">摄像头</option>
            <option value="2">电脑屏幕</option>
          </select>
        </div>
        <div class="form-group">
          <label for="downloadAudio">蓝牙话筒音频（若老师未使用蓝牙话筒则该路音频无声音）:</label>
          <select id="downloadAudio" name="downloadAudio" class="input-field">
            <option value="1">下载</option>
            <option value="2">不下载</option>
          </select>
        </div>
        <div class="form-group">
          <label id="courseName11">课程名:</label>
          <label id="professor11">老师:</label>
        </div>
        <div class="form-group">
          <label for="courses">选择课程编号:</label>
          <button type="button" class="btn blue" onclick="selectAll(true);">全选</button>
          <button type="button" class="btn blue" onclick="selectAll(false);">全不选</button>
          <ul id="courseList">
            <li data-value="1">请获取课程信息</li>
          </ul>
        </div>
        <button type="submit" class="btn blue">新建任务</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
